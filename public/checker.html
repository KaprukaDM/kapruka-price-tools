<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#402970" />
  <link rel="icon" href="https://www.kapruka.com/static/icons/favicon.ico" />
  <title>Kapruka · Price Checker</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header>
    <div class="bar">
      <img class="logo-mark" src="https://www.kapruka.com/static/icons/apple-touch-icon-180x180.png?v2"
           alt="Kapruka" onerror="this.style.display='none'" />
      <span class="logo">kapruka<span class="dot">.</span></span>
      <span class="pill">Price Checker</span>
      <span class="tag"><a href="index.html">← Menu</a></span>
    </div>
  </header>

  <div class="wrap">
    <h1>Find the best price</h1>
    <p class="sub">Pick a category, describe the product, and we'll match live prices across curated stores and the top Sri Lankan shops — each with a confidence rate.</p>

    <div class="card">
      <div class="tabs" role="tablist" style="margin-bottom:16px">
        <button type="button" class="tab active" id="modeSearch" role="tab" aria-selected="true">Search by name &amp; description</button>
        <button type="button" class="tab" id="modeUrl" role="tab" aria-selected="false">Search by product URL</button>
      </div>

      <div id="searchFields" class="grid">
        <div>
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div>
          <label for="name">Product name</label>
          <input id="name" placeholder="e.g. iPhone 15 256GB" />
        </div>
        <div class="full">
          <label for="description">Description (optional, improves accuracy)</label>
          <textarea id="description" placeholder="e.g. Apple iPhone 15, Black, with Apple Care"></textarea>
        </div>
      </div>

      <div id="urlFields" class="grid" style="display:none">
        <div class="full">
          <label for="productUrl">Kapruka product URL</label>
          <input id="productUrl" placeholder="https://www.kapruka.com/buyonline/..." />
        </div>
      </div>

      <button id="go">Match prices</button>
      <a class="btn-link" href="/api/export/price-checks.csv" style="margin-left:10px">⬇ Export all checks (CSV)</a>
      <span id="hint" class="hint"></span>
    </div>

    <div id="out"></div>
  </div>

  <div class="floating-panel" id="categoryPanel">
    <button type="button" class="ghost" id="toggleAddCategory">➕ Add a category</button>
    <div id="addCategoryForm" class="floating-form" style="display:none">
      <button type="button" class="panel-close" id="closeAddCategory" aria-label="Close">×</button>
      <label for="newCategoryName">Category name</label>
      <input id="newCategoryName" placeholder="e.g. Home Appliances" />
      <label style="margin-top:14px">Competitor links (up to 5)</label>
      <input class="competitor-link" placeholder="https://competitor1.lk" style="margin-bottom:8px" />
      <input class="competitor-link" placeholder="https://competitor2.lk" style="margin-bottom:8px" />
      <input class="competitor-link" placeholder="https://competitor3.lk" style="margin-bottom:8px" />
      <input class="competitor-link" placeholder="https://competitor4.lk" style="margin-bottom:8px" />
      <input class="competitor-link" placeholder="https://competitor5.lk" />
      <button id="saveCategory">Save category</button>
      <span id="categoryHint" class="hint"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
