name: International Gifting Price Checker — Deploy to GitHub Pages

# Publishes public/uae-compare/ (the static dashboard) to GitHub Pages on
# every push that touches it. The page itself has no server — it reads
# results straight from Supabase and triggers refresh/pairing-edit workflows
# via the GitHub API. See public/uae-compare/index.html and the other
# uae-compare-*.yml workflows.
#
# One-time setup required: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'public/uae-compare/**'
      - '.github/workflows/uae-compare-deploy-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/uae-compare
      - id: deployment
        uses: actions/deploy-pages@v4
