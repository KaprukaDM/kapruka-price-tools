name: Price Tools — Deploy to GitHub Pages

# Publishes the whole public/ folder (home index + uae-compare) to GitHub
# Pages on every push that touches it. Only index.html and public/uae-compare/
# are fully static (uae-compare reads straight from Supabase and triggers
# refresh/pairing-edit workflows via the GitHub API). checker.html,
# compare.html and overpriced.html need the Express API (src/server.js) and
# only work when loaded from the Render deployment — index.html detects a
# github.io host and points those tool cards there instead of the relative
# path used on Render. See public/index.html and public/uae-compare/index.html.
#
# One-time setup required: repo Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/uae-compare-deploy-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
